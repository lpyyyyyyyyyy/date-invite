<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd7d2">
  <title>暹罗猫预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #ffd7d2; font-family: "Microsoft YaHei", sans-serif; }
    #cat-preview { position: fixed; inset: 0; touch-action: none; cursor: grab; }
    #cat-preview:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; }
    .label { position: fixed; z-index: 1; top: max(24px, env(safe-area-inset-top)); left: 0; right: 0; color: #4d302b; text-align: center; pointer-events: none; }
    .label p { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0; }
    .label h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: 0; }
    #model-error { position: fixed; top: 50%; left: 50%; display: none; max-width: 260px; color: #765c55; text-align: center; line-height: 1.6; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <div class="label" aria-hidden="true"><p>LEO & EMILY</p><h1>暹罗小猫</h1></div>
  <main id="cat-preview" aria-label="可旋转查看的暹罗猫模型"></main>
  <p id="model-error" role="status">模型暂时没有加载成功。</p>
  <script src="three.min.js"></script>
  <script src="fflate.min.js"></script>
  <script src="FBXLoader.js"></script>
  <script>
    (() => {
      const THREE = window.THREE;
      const stage = document.querySelector("#cat-preview");
      const error = document.querySelector("#model-error");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
      camera.position.set(0, 1.35, 6.3);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      stage.appendChild(renderer.domElement);

      const root = new THREE.Group();
      root.rotation.y = -0.35;
      scene.add(root);
      scene.add(new THREE.HemisphereLight(0xfff1e6, 0x694f58, 1.65));
      const key = new THREE.DirectionalLight(0xffffff, 1.25);
      key.position.set(-3, 5, 5);
      scene.add(key);
      const fill = new THREE.PointLight(0xffadc0, 0.5, 10);
      fill.position.set(3, 2, 4);
      scene.add(fill);

      new THREE.FBXLoader().load("siamese-cat.fbx", (model) => {
        model.traverse((node) => {
          if (!node.isMesh) return;
          node.castShadow = true;
          node.receiveShadow = true;
          if (!node.material) node.material = new THREE.MeshStandardMaterial({ color: 0xf0d8bd, roughness: 0.8 });
        });
        const bounds = new THREE.Box3().setFromObject(model);
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        model.position.sub(center);
        model.scale.setScalar(2.85 / (Math.max(size.x, size.y, size.z) || 1));
        const fittedBounds = new THREE.Box3().setFromObject(model);
        model.position.y -= fittedBounds.min.y;
        root.add(model);
      }, undefined, () => { error.style.display = "block"; });

      let targetRotation = root.rotation.y;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      stage.addEventListener("pointerdown", (event) => { dragging = true; lastX = event.clientX; lastY = event.clientY; stage.setPointerCapture(event.pointerId); });
      stage.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        targetRotation += (event.clientX - lastX) * 0.015;
        root.rotation.x = Math.max(-0.18, Math.min(0.18, root.rotation.x + (event.clientY - lastY) * 0.004));
        lastX = event.clientX;
        lastY = event.clientY;
      });
      stage.addEventListener("pointerup", () => { dragging = false; });
      stage.addEventListener("pointercancel", () => { dragging = false; });
      function resize() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.position.z = width / height < 0.7 ? 9.6 : 6.3;
        camera.updateProjectionMatrix();
      }
      new ResizeObserver(resize).observe(stage);
      resize();
      const clock = new THREE.Clock();
      (function animate() {
        root.position.y = Math.sin(clock.getElapsedTime() * 1.45) * 0.055;
        root.rotation.y += (targetRotation - root.rotation.y) * 0.09;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      })();
    })();
  </script>
</body>
</html>
