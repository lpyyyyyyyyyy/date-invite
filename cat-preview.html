<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd7d2">
  <title>暹罗猫预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #ffd7d2; font-family: "Microsoft YaHei", sans-serif; }
    #cat-preview { position: fixed; inset: 0; touch-action: none; cursor: grab; }
    #cat-preview:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; }
    .label { position: fixed; top: max(24px, env(safe-area-inset-top)); left: 0; right: 0; color: #4d302b; text-align: center; pointer-events: none; }
    .label p { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: 0; }
    .label h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: 0; }
  </style>
</head>
<body>
  <div class="label" aria-hidden="true"><p>LEO & EMILY</p><h1>暹罗小猫</h1></div>
  <main id="cat-preview" aria-label="可旋转查看的暹罗猫毛绒玩偶模型"></main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script>
    (() => {
      const THREE = window.THREE;
      const stage = document.querySelector("#cat-preview");
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
      camera.position.set(0, 1.25, 10);
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.88;
      stage.appendChild(renderer.domElement);

      const cream = new THREE.MeshStandardMaterial({ color: 0xeed6bb, roughness: 0.88, metalness: 0 });
      const pale = new THREE.MeshStandardMaterial({ color: 0xffecd5, roughness: 0.92, metalness: 0 });
      const point = new THREE.MeshStandardMaterial({ color: 0x533a42, roughness: 0.83, metalness: 0 });
      const mask = new THREE.MeshStandardMaterial({ color: 0x856d70, roughness: 0.86, metalness: 0 });
      const white = new THREE.MeshStandardMaterial({ color: 0xfffbf4, roughness: 0.42, metalness: 0 });
      const blue = new THREE.MeshStandardMaterial({ color: 0x23bdeb, roughness: 0.12, metalness: 0.16 });
      const pupil = new THREE.MeshStandardMaterial({ color: 0x252229, roughness: 0.2, metalness: 0.02 });
      const rose = new THREE.MeshStandardMaterial({ color: 0x8b6265, roughness: 0.65, metalness: 0 });
      const root = new THREE.Group();
      const body = new THREE.Group();
      const head = new THREE.Group();
      const tail = new THREE.Group();
      root.add(body, head, tail);
      root.rotation.y = -0.42;
      scene.add(root);

      function fluffy(parent, position, scale, material, detail = 26) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, detail, Math.max(12, Math.round(detail * 0.7))), material);
        mesh.position.set(...position);
        mesh.scale.set(...scale);
        parent.add(mesh);
        return mesh;
      }
      fluffy(body, [0, -0.45, 0], [1, 0.98, 0.78], cream, 32);
      fluffy(head, [0, 1.34, 0.04], [1.3, 1.16, 1], cream, 32);
      fluffy(head, [0, 1.18, 1.01], [0.82, 0.62, 0.08], mask, 26);
      fluffy(head, [0, 0.65, 1.09], [0.69, 0.38, 0.12], pale, 24);
      fluffy(body, [0, -0.22, 0.78], [0.52, 0.66, 0.1], pale, 22);
      fluffy(body, [-0.5, -1.18, 0.72], [0.36, 0.23, 0.25], point, 20);
      fluffy(body, [0.5, -1.18, 0.72], [0.36, 0.23, 0.25], point, 20);

      const earShape = new THREE.ConeGeometry(0.5, 0.98, 4);
      [[-0.72, 2.28, 0.02, -0.34], [0.72, 2.28, 0.02, 0.34]].forEach(([x, y, z, rotate]) => {
        const ear = new THREE.Mesh(earShape, point);
        ear.position.set(x, y, z); ear.rotation.set(0, Math.PI / 4, rotate); head.add(ear);
        const inner = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.6, 4), rose);
        inner.position.set(x, y - 0.02, z + 0.2); inner.rotation.copy(ear.rotation); inner.scale.set(0.88, 0.82, 0.88); head.add(inner);
      });
      [[-0.41, 1.34, 1.08], [0.41, 1.34, 1.08]].forEach(([x, y, z]) => {
        fluffy(head, [x, y, z], [0.3, 0.38, 0.07], white, 22);
        fluffy(head, [x, y - 0.025, z + 0.07], [0.18, 0.26, 0.04], blue, 20);
        fluffy(head, [x, y - 0.015, z + 0.11], [0.096, 0.16, 0.024], pupil, 18);
        fluffy(head, [x + (x < 0 ? -0.055 : 0.055), y + 0.09, z + 0.135], [0.045, 0.058, 0.014], white, 12);
      });
      fluffy(head, [0, 0.93, 1.22], [0.12, 0.08, 0.055], rose, 16);
      const whiskerMaterial = new THREE.LineBasicMaterial({ color: 0xf5e8df, transparent: true, opacity: 0.92 });
      [-1, 1].forEach((side) => [-0.06, 0.04, 0.14].forEach((offset) => {
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(side * 0.1, 0.92 + offset, 1.2), new THREE.Vector3(side * 0.66, 0.92 + offset * 1.4, 1.25), new THREE.Vector3(side * 0.98, 0.88 + offset * 1.7, 1.06)]), whiskerMaterial);
        head.add(line);
      }));
      const tailCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0.88, -0.58, -0.2), new THREE.Vector3(1.45, -0.05, -0.36), new THREE.Vector3(1.42, 0.66, -0.22), new THREE.Vector3(1, 0.82, -0.12)]);
      tail.add(new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 28, 0.17, 12, false), point));

      scene.add(new THREE.HemisphereLight(0xffefd9, 0x6f4660, 1.35));
      const key = new THREE.DirectionalLight(0xfff5e9, 1.05); key.position.set(-3, 5, 5); scene.add(key);
      const fill = new THREE.PointLight(0xffa7b3, 0.55, 12); fill.position.set(3, 1, 4); scene.add(fill);

      let targetRotation = root.rotation.y, dragging = false, lastX = 0, lastY = 0;
      stage.addEventListener("pointerdown", (event) => { dragging = true; lastX = event.clientX; lastY = event.clientY; stage.setPointerCapture(event.pointerId); });
      stage.addEventListener("pointermove", (event) => { if (!dragging) return; targetRotation += (event.clientX - lastX) * 0.015; head.rotation.x = Math.max(-0.22, Math.min(0.22, head.rotation.x + (event.clientY - lastY) * 0.004)); lastX = event.clientX; lastY = event.clientY; });
      stage.addEventListener("pointerup", () => { dragging = false; });
      stage.addEventListener("pointercancel", () => { dragging = false; });
      function resize() { const width = stage.clientWidth, height = stage.clientHeight; renderer.setSize(width, height, false); camera.aspect = width / height; camera.position.z = width / height < 0.7 ? 12.4 : 10; camera.updateProjectionMatrix(); }
      new ResizeObserver(resize).observe(stage); resize();
      const clock = new THREE.Clock();
      (function animate() { const time = clock.getElapsedTime(); root.position.y = Math.sin(time * 1.5) * 0.1; root.rotation.y += (targetRotation - root.rotation.y) * 0.08; tail.rotation.y = Math.sin(time * 2.1) * 0.2; head.rotation.z = Math.sin(time * 1.4) * 0.035; renderer.render(scene, camera); requestAnimationFrame(animate); })();
    })();
  </script>
</body>
</html>
